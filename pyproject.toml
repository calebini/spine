[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-ledger"
version = "0.1.0"
description = "Canonical coordination ledger and planning fabric for Cortext1."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "calebini" }
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
