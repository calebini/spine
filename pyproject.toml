[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-ledger"
version = "0.1.0"
description = "Canonical coordination ledger and planning fabric for Cortext1."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "calebini" }
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23",
  "pytest>=8",
]
dev = [
  "mypy>=1.13",
  "ruff>=0.8",
]

[project.scripts]
spine = "spine.commands.cli:main"
spine-command = "spine.commands.cli:main"
spine-ledger-migrate = "spine.ledger.migrate:main"
spine-openclaw-smoke = "spine.runtime.openclaw_smoke:main"
spine-seed-canary = "spine.runtime.seed_canary:main"
spine-seed-demo = "spine.runtime.seed_demo:main"
spine-tickerd-observe = "spine.runtime.tickerd_observe:main"
spine-tickerd-runner = "spine.runtime.tickerd_runner:main"
spine-worker = "spine.runtime.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spine.ledger" = ["schema.sql", "schema_object_manifest.v1.json", "migrations/*.sql"]
"spine" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "src/spine/core",
  "src/spine/ledger",
]
