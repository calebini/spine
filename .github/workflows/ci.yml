name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and development tools
        run: python -m pip install -e ".[dev,test]"

      - name: Lint
        run: ruff check src/spine/core src/spine/ledger

      - name: Type check core and ledger
        run: mypy --strict src/spine/core src/spine/ledger

      - name: Run tests
        run: python -m unittest discover -s tests
